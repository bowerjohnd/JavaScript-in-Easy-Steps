<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Data</title>
</head>
<body>
    
    <fieldset>
        <legend id="legend">Enter Data</legend>
        <input id="data" type="text">
        <button onclick="store()">Store Data</button>
        <button onclick="recall()">Recall Data</button>
        <button onclick="remove()">Reset</button>
    </fieldset>


    <script>

        function store() {
            let data = document.getElementById('data').value;
            
            if (data === '') {
                console.log('store empty');
                return false 
            } else {
                console.log('store proc');
                localStorage.setItem('ls_data', data);
                document.getElementById('data').value = '';
                document.getElementById('legend').innerText =
                    localStorage.getItem('ls_data') + ' - is stored';
            }
        }

        function recall() {
            if (localStorage.getItem('ls_data') === null) {
                document.getElementById('legend').innerText =
                    'Enter Data'; 
                console.log('recall null');    
                return false 
            } else {
                console.log('recall proc');
                document.getElementById('data').value = '';
                document.getElementById('legend').innerText =
                    'Stored Data: ' + localStorage.getItem('ls_data');
            }
        }

        function remove() {
            if (localStorage.getItem('ls_data') === null) {
                document.getElementById('legend').innerText =
                    'Enter Data'; 
                console.log('remove null');
                return false
            } else {
                console.log('remove proc');
                document.getElementById('legend').innerText = 
                    localStorage.getItem('ls_data') + ' is Removed';
                localStorage.removeItem('ls_data');
                document.getElementById('data').value = '';
            }
        }

        
    </script>

</body>
</html>
