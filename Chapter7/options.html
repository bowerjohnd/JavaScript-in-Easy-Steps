<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Options</title>
</head>
<body>
    
    <!-- I do not have Perl installed. With no errors, I will leave this example as is. -->

    <form action="echo.pl" method="POST">
        <select id="list" name="City">
            <option value="Rome" selected>Rome</option>
            <option value="London">London</option>
            <option value="New York">New York</option>
        </select>
        <input type="submit">
    </form>

    <p id="info"></p>



    <script>

        (function() {

            const list = document.getElementById('list');
            list.addEventListener('change', function(){reactTo(list, event);})
            addEventListener('load', function(){reactTo(list,event);})

        })()

        function reactTo(list, event) {
            
            const info = document.getElementById('info');
            let index = list.options.selectedIndex;
            let city = list.options[index].value;
            info.innerHTML = event.type + '<br>Selected: ';
            info.innerHTML += city + '<br>Index: ' + index;
        }
        
    </script>

</body>
</html>
