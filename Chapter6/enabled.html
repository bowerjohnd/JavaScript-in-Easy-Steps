<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Status</title>
</head>
<body>

    <p id="info"></p>

    <script>
        (function() {

            const info = document.getElementById('info');
            let status = '';

            status = (navigator.javaEnabled()) ? 'Enabled' : 'Disabled';
            info.innerHTML += 'Java Support is ' + status + '<hr>';

            status = (navigator.cookieEnabled) ? 'Enabled' : 'Disabled';
            info.innerHTML += 'Cookie Support is ' + status + '<hr>';

            if (navigator.plugins.length !== 0) {
                info.innerHTML += 'No. of Plugins: ' + navigator.plugins.length;
                
                for (let i = 0; i < navigator.plugins.length; i++) {
                    info.innerHTML += '<br>Plugin [' + i + ']: ' + navigator.plugins[i].name;
                    info.innerHTML += '<br>For: ' + navigator.plugins[i].description + '<hr>'
                }
            }

            if (navigator.mimeTypes.length !== 0) {
                info.innerHTML += 'No. of MIME Types: ' + navigator.mimeTypes.length;

                for (let i = 0; i < navigator.mimeTypes.length; i++) {
                    info.innerHTML += '<br>Mime Type [' + i + ']: ' + navigator.mimeTypes[i].type;
                    info.innerHTML += '<br>For: ' + navigator.mimeTypes[i].description;
                }
            }

        })()
    </script>
    
</body>
</html>
